name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-profile-cards.py"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate dark and light SVG cards
        env:
          GITHUB_USERNAME: HitDrama
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-profile-cards.py

      - name: Set up Deno for upstream trophy renderer
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Render upstream GitHub trophies
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          path: .trophy-source
          fetch-depth: 1

      - name: Generate trophy cards from github-profile-trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API: https://api.github.com/graphql
        run: |
          rm -f assets/github-trophies-dark.svg assets/github-trophies-light.svg
          deno run --allow-all \
            .trophy-source/render_svg.ts HitDrama assets/github-trophies-dark.svg dracula
          deno run --allow-all \
            .trophy-source/render_svg.ts HitDrama assets/github-trophies-light.svg flat

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh profile cards"
          file_pattern: "assets/*.svg"
